<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calculator Widget</title>
    <style>
        /* [All CSS remains the same as in my previous response] */
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading...</div>
    </div>

    <div id="calculator" style="display: none;">
        <!-- [All HTML content remains the same as in my previous response] -->
    </div>

    <script>
        // Global variables
        let currentTab = 0;
        let quotes = [];
        let dealId = '';
        let accountId = '';
        let autoSaveTimer = null;
        
        // Try to get ZCRM object from parent window
        function getZCRM() {
            // Check if ZCRM is already available in this window
            if (typeof ZCRM !== 'undefined') {
                console.log('Found ZCRM in current window');
                return ZCRM;
            }
            
            // Try parent window (if in iframe)
            if (window.parent && typeof window.parent.ZCRM !== 'undefined') {
                console.log('Found ZCRM in parent window');
                return window.parent.ZCRM;
            }
            
            // Try top window
            if (window.top && typeof window.top.ZCRM !== 'undefined') {
                console.log('Found ZCRM in top window');
                return window.top.ZCRM;
            }
            
            return null;
        }
        
        // Load Zoho CRM SDK from multiple sources (fallback chain)
        function loadZohoCRM() {
            return new Promise((resolve, reject) => {
                // First, check if ZCRM is already available (from parent window)
                const existingZCRM = getZCRM();
                if (existingZCRM) {
                    console.log('ZCRM already available, skipping SDK load');
                    resolve(existingZCRM);
                    return;
                }
                
                // Array of possible CDN URLs (try different mirrors)
                const cdnUrls = [
                    // Try jsDelivr first (often not blocked)
                    'https://cdn.jsdelivr.net/npm/zoho-crm-sdk@1.0.0/dist/zoho-crm-sdk.min.js',
                    // Try unpkg
                    'https://unpkg.com/zoho-crm-sdk@1.0.0/dist/zoho-crm-sdk.min.js',
                    // Try GitHub raw (if you can access it)
                    'https://raw.githubusercontent.com/zoho/zoho-crm-sdk/master/dist/zoho-crm-sdk.min.js',
                    // Original Zoho CDN (likely blocked)
                    'https://cdn.zohopublic.com/crm/crm-widget-sdk/v1/zoho-crm-widget-sdk.min.js'
                ];
                
                let currentUrlIndex = 0;
                
                function tryNextUrl() {
                    if (currentUrlIndex >= cdnUrls.length) {
                        reject(new Error('All CDN sources failed. Please check network/firewall settings.'));
                        return;
                    }
                    
                    const url = cdnUrls[currentUrlIndex];
                    console.log(`Attempting to load SDK from: ${url}`);
                    
                    const script = document.createElement('script');
                    script.src = url;
                    script.async = true;
                    
                    script.onload = function() {
                        console.log(`Successfully loaded SDK from: ${url}`);
                        if (typeof ZCRM !== 'undefined') {
                            resolve(ZCRM);
                        } else {
                            reject(new Error('SDK loaded but ZCRM object not found'));
                        }
                    };
                    
                    script.onerror = function() {
                        console.warn(`Failed to load SDK from: ${url}`);
                        currentUrlIndex++;
                        tryNextUrl();
                    };
                    
                    document.head.appendChild(script);
                }
                
                tryNextUrl();
            });
        }
        
        // Initialize the widget
        document.addEventListener('DOMContentLoaded', async function() {
            // Show debug info
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.style.display = 'block';
            debugInfo.innerHTML = `
                <strong>Debug Information:</strong><br>
                Full URL: ${window.location.href}<br>
                Query String: ${window.location.search}<br>
                All URL Parameters:<br>
                ${Array.from(new URLSearchParams(window.location.search).entries())
                    .map(([key, value]) => `&nbsp;&nbsp;${key}: ${value}`)
                    .join('<br>')}<br><br>
                Looking for: recordId parameter
            `;
            
            // Extract recordId from URL
            const urlParams = new URLSearchParams(window.location.search);
            dealId = urlParams.get('recordId') || 
                     urlParams.get('id') || 
                     urlParams.get('dealId');
            
            console.log('URL Parameters:', window.location.search);
            console.log('Extracted Deal ID:', dealId);
            
            // Update debug info
            debugInfo.innerHTML += `<br><br><strong>Extracted Deal ID:</strong> ${dealId || 'Not found'}`;
            
            if (!dealId) {
                showError('No Deal ID found in URL. Please open from Zoho CRM using the "Open Finance Calculator" button.');
                return;
            }
            
            // Show loading message
            const loadingDiv = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            loadingText.textContent = 'Checking Zoho CRM connection...';
            
            try {
                // Try to load Zoho CRM SDK
                const ZCRM = await loadZohoCRM();
                
                loadingText.textContent = 'Initializing Zoho CRM connection...';
                
                // Initialize ZCRM
                ZCRM.init({
                    onLoad: function() {
                        console.log('ZCRM initialized, loading deal data...');
                        loadDealData();
                    },
                    onError: function(error) {
                        console.error('ZCRM initialization error:', error);
                        showError('Failed to initialize Zoho CRM connection: ' + error.message);
                    }
                });
            } catch (error) {
                console.error('Error loading Zoho CRM SDK:', error);
                showSDKError(error);
            }
        });
        
        // Show SDK loading error with troubleshooting steps
        function showSDKError(error) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'sdk-loading';
            errorDiv.innerHTML = `
                <h3 style="color: #856404;">⚠️ Zoho CRM SDK Loading Failed</h3>
                <p style="margin: 10px 0;">
                    <strong>Error:</strong> ${error.message}
                </p>
                <p style="margin: 10px 0;">
                    <strong>Deal ID:</strong> ${dealId}
                </p>
                <p style="margin: 10px 0;">
                    <strong>Current URL:</strong> ${window.location.href}
                </p>
                
                <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                    <h4 style="color: #856404; margin-bottom: 10px;">Troubleshooting Steps:</h4>
                    <ol style="margin-left: 20px;">
                        <li><strong>Check network access:</strong> Your corporate network may be blocking access to CDN domains. Contact your IT department to whitelist:
                            <ul>
                                <li><code>cdn.jsdelivr.net</code></li>
                                <li><code>unpkg.com</code></li>
                                <li><code>raw.githubusercontent.com</code></li>
                            </ul>
                        </li>
                        <li><strong>Use the correct button:</strong> Make sure you're clicking the <strong>"Open Finance Calculator"</strong> button in Zoho CRM (the one that runs the Deluge function), not a regular custom button.</li>
                        <li><strong>Check browser console (F12):</strong> Look for any errors related to ZCRM or cross-origin restrictions.</li>
                        <li><strong>Try a different browser:</strong> Some browsers have stricter security policies for iframes.</li>
                        <li><strong>Check Zoho CRM widget settings:</strong> Ensure the widget is properly configured in Zoho CRM Setup > Developer Space > Custom Buttons.</li>
                    </ol>
                </div>
                
                <p style="margin-top: 15px;">
                    <button class="btn-primary" onclick="location.reload()">Retry</button>
                    <button class="btn-info" onclick="closeWidget()">Close</button>
                </p>
            `;
            document.body.insertBefore(errorDiv, document.body.firstChild);
            document.getElementById('loading').style.display = 'none';
        }
        
        // Show error message
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `
                <h3 style="color: #f00;">❌ Error</h3>
                <p>${message}</p>
                <p><strong>Current URL:</strong> ${window.location.href}</p>
                <p><strong>Deal ID:</strong> ${dealId || 'Not found'}</p>
                
                <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                    <h4 style="color: #c0392b;">How to Fix:</h4>
                    <p>In Zoho CRM, use the <strong>"Open Finance Calculator"</strong> button (the one that runs the Deluge function) to open this calculator. The regular button doesn't pass the Deal ID correctly.</p>
                </div>
                
                <p style="margin-top: 15px;">
                    <button class="btn-primary" onclick="location.reload()">Retry</button>
                    <button class="btn-info" onclick="closeWidget()">Close</button>
                </p>
            `;
            document.body.insertBefore(errorDiv, document.body.firstChild);
            document.getElementById('loading').style.display = 'none';
        }
        
        // Load deal data
        function loadDealData() {
            ZCRM.API.call({
                url: `/crm/v2/Deals/${dealId}`,
                method: 'GET'
            }).then(function(response) {
                if (response && response.data && response.data.length > 0) {
                    const deal = response.data[0];
                    accountId = deal.Account && deal.Account.id ? deal.Account.id : '';
                    
                    // Load account details
                    if (accountId) {
                        ZCRM.API.call({
                            url: `/crm/v2/Accounts/${accountId}`,
                            method: 'GET'
                        }).then(function(accountResponse) {
                            if (accountResponse && accountResponse.data && accountResponse.data.length > 0) {
                                document.getElementById('accountName').value = 
                                    accountResponse.data[0].Account_Name || '';
                            }
                        }).catch(function(error) {
                            console.error('Error loading account:', error);
                        });
                    }
                    
                    // Load existing quotes
                    loadExistingQuotes();
                    
                    // Show calculator
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('calculator').style.display = 'block';
                    
                    // Create first tab
                    createNewTab();
                    
                    // Start auto-save
                    startAutoSave();
                }
            }).catch(function(error) {
                console.error('Error loading deal:', error);
                showError('Error loading deal data: ' + error.message);
            });
        }
        
        // Load existing quotes from subform
        function loadExistingQuotes() {
            ZCRM.API.call({
                url: `/crm/v2/Deals/${dealId}/Finance_Quotes`,
                method: 'GET'
            }).then(function(response) {
                if (response && response.data) {
                    quotes = response.data.map(q => ({
                        id: q.id,
                        lender: q.Lender_Name || '',
                        loanAmount: q.Loan_Amount || 0,
                        term: q.Term_Months || 60,
                        lenderRate: q.Lender_Rate || 5,
                        margin: q.Margin || 0,
                        customerRate: q.Customer_Rate || 5,
                        monthlyPayment: q.Monthly_Payment || 0,
                        balloonPayment: q.Balloon_Payment || 0,
                        totalInterest: q.Total_Interest || 0,
                        totalRepayment: q.Total_Repayment || 0,
                        preferred: q.Preferred ? q.Preferred.toLowerCase() === 'yes' : false
                    }));
                    
                    // Sort by preferred first, then by total repayment
                    quotes.sort((a, b) => {
                        if (a.preferred && !b.preferred) return -1;
                        if (!a.preferred && b.preferred) return 1;
                        return a.totalRepayment - b.totalRepayment;
                    });
                    
                    // Render quotes
                    renderQuotes();
                }
            }).catch(function(error) {
                console.error('Error loading quotes:', error);
            });
        }
        
        // [Rest of the JavaScript functions remain the same as in my previous response]
        
        // Close widget
        function closeWidget() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({action: 'closeWidget'}, '*');
            } else {
                window.close();
            }
        }
    </script>
</body>
</html>
